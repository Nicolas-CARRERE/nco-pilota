server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The production build calls the API on its own origin, under /api
    # (src/environments/environment.prod.ts). The Node.js API serves its public
    # routes at the root (/games, /stats, ...), so the prefix is stripped here;
    # the trailing slash on proxy_pass is what strips it.
    #
    # `api` is the compose service name and only resolves inside the compose
    # network.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The test router is the one API mount that lives under /api
    # (api/src/index.ts), so this prefix is passed through unchanged. No trailing
    # slash on proxy_pass means the original URI is forwarded as-is.
    location /api/test/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
